plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

def releaseKeystore = System.getenv('COURRIER_ANDROID_KEYSTORE')
def releaseAlias = System.getenv('COURRIER_ANDROID_KEY_ALIAS')
def releaseStorePassword = System.getenv('COURRIER_ANDROID_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('COURRIER_ANDROID_KEY_PASSWORD')
def releaseSigningAvailable = [releaseKeystore, releaseAlias, releaseStorePassword, releaseKeyPassword].every { it }

android {
    namespace 'com.courrier.app'; compileSdk 35
    defaultConfig { applicationId 'com.courrier.app'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    signingConfigs {
        if (releaseSigningAvailable) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release { if (releaseSigningAvailable) signingConfig signingConfigs.release }
    }
    buildFeatures { buildConfig true }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

apply from: 'capacitor.build.gradle'
